[project]
name = "observasage"
version = "0.1.0"
description = "Multi-signal CI/CD Root Cause Analysis — Logs + Metrics + Traces"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "drain3>=0.9.11",
    "google-genai>=0.1.1",
    "google-generativeai>=0.7.0",
    "docker>=7.0.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pyarrow>=25.0.1",
    "tiktoken>=0.14.0",
    "huggingface-hub>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
